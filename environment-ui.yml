# Front-end dependencies (WP1b).
#
# ON THIS MACHINE they are installed straight into the `flopy` model env, and
# that turned out to be the right call: the conda solve touches nothing in the
# model stack -- no numpy, flopy, rasterio, h5py, gdal, matplotlib, geopandas,
# shapely or pyproj is superseded, downgraded or changed; only ca-certificates,
# certifi and openssl are updated.
#
#   conda install -n flopy -c conda-forge streamlit streamlit-folium
#
# This file is the recipe for a FRESH MACHINE or a server where you would
# rather keep the front-end separate. Either way the invariant that matters is
# in the CODE, not the environment: the model never imports streamlit, and
# code/tests/test_repo_hygiene.py asserts it -- so the model still runs where
# streamlit is absent, such as a PEST worker.
#
#   conda env create -f environment-ui.yml && conda activate mm-ui
#   streamlit run code/app/Home.py
name: mm-ui
channels:
  - conda-forge
dependencies:
  - python=3.12
  - streamlit>=1.36
  - streamlit-folium>=0.21
  - folium>=0.16
  - geopandas>=1.0
  - rasterio>=1.3
  - numpy>=2.0
