# Streamlit settings for the MARMITES front-end (WP1b).
# Start it with  python code/tools/launch_app.py  (which mirrors the code to a
# local disk first when the checkout is on a network drive, and copies this
# file with it). Serving from the SERVER: run it there and reach it over the
# LAN --
#   python code/tools/launch_app.py -- --server.address 0.0.0.0 --server.port 8501
# The PEST workers already run there and the app only needs to see $MM_WS_ROOT.

[server]
address = "localhost"     # "0.0.0.0" to serve over the LAN from the server
port = 8501
headless = true
maxUploadSize = 50
fileWatcherType = "auto"

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#1f4e79"
