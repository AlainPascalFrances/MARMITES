si = 0.215
ks = 5.0

[[soil.horizon]]
zone = 2
slprop = 0.45
smax = 0.35
sfc = 0.2
sr = 0.125
si = 0.25
ks = 3.0

[[soil.horizon]]
zone = 3
slprop = 1.0
smax = 0.05
sfc = 0.02
sr = 0.01
