albedo_dry = 0.3
albedo_wet = 0.2
j_dry = 130
j_wet = 270
trans_dry_wet = 20
trans_wet_dry = 20

[soil]
veg_layer = "lm_veg.shp"
veg_column = "Species"
irr_infiltration = "column"

[soil.zones]
layer = "Soil_type.shp"
column = "SoilCode"
how = "majority"
fill = 0.0

[soil.thickness]
how = "area_mean"
raster = "inputSOILthick.asc"
fill = 0.0

[[soil.zone]]
name = "SOIL1 - alluvium"
type = "sandy loam field"

[[soil.zone]]
name = "SOIL2 - regolith"
type = "sandy loam field"

[[soil.zone]]
name = "SOIL3 - outcrop"
type = "sand"

[[soil.horizon]]
zone = 1
slprop = 0.75
smax = 0.15
