[[soil.veg_class]]
code = "g"
veg = 1

[[soil.veg_class]]
code = "i"
veg = 2

[[soil.veg_class]]
code = "p"
veg = 3

[obs]
table = "inputObs.txt"
layer = "202109MonitPts.shp"
name_column = "Name"
heads_prefix = "inputObsHEADS"
sm_prefix = "inputObsSM"
aet_prefix = ""
ro_prefix = "inputObsRo"

[layers]
nlay = 2
hnoflo = 9999.999
k33_as_ratio = true
convertible = true

[layers.ibound]
how = "auto"
raster = "MF_ws/ibound_l%d.asc"
fill = 0.0

[layers.thickness]
how = "auto"
raster = "MF_ws/thick_l%d.asc"
fill = 0.0

[layers.k]
how = "auto"
raster = "MF_ws/hk_l%d.asc"
fill = 0.0

[layers.k33]
how = "auto"
value = 2.0
fill = 0.0

[layers.ss]
how = "auto"
raster = "MF_ws/Ss_l%d.asc"
fill = 0.0

[layers.sy]
how = "auto"
raster = "MF_ws/Sy_l%d.asc"
fill = 0.0

[ghb]
enable = false
layers = [1, 2]
line = ""
cond_per = "length"

[ghb.head]
how = "auto"
raster = "MF_ws/ghb_head_l%d.asc"
fill = 0.0

[ghb.cond]
how = "auto"
raster = "MF_ws/ghb_cond_l%d.asc"
fill = 0.0

[drn]
enable = true
layers = [1, 2]
line = "lm_outlet_drn.shp"
cond_per = "length"
at_layer_base = true

[drn.elevation]
how = "auto"
raster = "MF_ws/drn_elev_l%d.asc"
fill = 0.0

[drn.cond]
how = "auto"
value = 0.00084
fill = 0.0

[uzf]
ntrailwaves = 15
nwavesets = 500
surfdep = 0.25
thtr_from = "sy"
vks_from = "layer"
vks_scale = 1.0

[uzf.eps]
how = "auto"
value = 3.5
fill = 0.0

[uzf.thtr]
how = "auto"
value = 0.05
fill = 0.0

[uzf.thts]
how = "auto"
value = 0.45
fill = 0.0

[uzf.thti]
how = "auto"
value = 0.15
fill = 0.0

[uzf.vks]
how = "auto"
fill = 0.0

[seep]
kind = "drn"
cond = 100.0
ddrn = 0.125
base = 0.0
cond_from = "value"

[et]
unsat_form = "etwc"
gw_route = "evt"
evt_nseg = 8
evt_ramp = 0.1
extdp_from = "vegetation"
extwc_source = "thtr"

[et.extdp]
how = "auto"
value = 2.0
fill = 0.0

[sfr]
enable = true
source = "inputSTREAM.csv"
min_slope = 0.0001
monotonic_bed = true

[sfr.width]
drainage = {w_min = 1.5, w_max = 3.0, power = 2.0}

[sfr.depth]
value = 0.5

[sfr.manning]
value = 0.035

[sfr.rhk]
value = 0.1

[sfr.rbth]
value = 0.2

[lak]
enable = true
source = "inputPONDS.csv"
polygons = "lm_ponds.shp"
depth = 1.5
geometry = "inputPONDS.geojson"
bedleak = 0.001
surfdep = 0.05
maxiter = 200
stagechg = 0.0001

[crr]
enable = true
beta = 1.0
sinks = "evaporate"
dem = "inputDEM.asc"

[spinup]
cycles = 6
tol = 0.05
strt_heads = "hi_voronoi_lamata_rbth02"
steady_means = ""
save_strt = "hi_voronoi_lamata_evt"
save_means = "hi_voronoi_lamata_evt"
strt_dem = []

[postproc]
enable = true
only = false
sankey_min_flux = 0.05
sankey_full = true
sankey_obs_years = false
map_days = 6
hydro_year_start = 10
wb_unit = "year"
obs_series = true
sankey = true
input_maps = true
result_maps = true
tick_trimester_years = 10
tick_semester_years = 20

[solver]
complexity = "complex"
outer_dvclose = 0.025
outer_maximum = 100
inner_dvclose = 0.001
inner_rclose = 0.01
cell_averaging = "amt-hmk"

[pest]
use_pest_params = false
params_npz = "pest_optimised.npz"

[ui]
execution = "local"
runs_dir = ""
port = 8501
address = "localhost"
poll_secs = 3
