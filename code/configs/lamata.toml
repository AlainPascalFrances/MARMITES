# MARMITES resolved run configuration
# config_hash = 116b87e785094917

[meta]
config_version = 1
name = "2lay_drn_spinup"
description = "La Mata, 2 layers, DRN seepage, from the saved spin-up state"

[paths]
case = "LaMata"
ws = ""
gis_ws = ""
nwt_reference = ""
libmf6 = ""

[run]
surface = false
model = true
plot = true
mode = "lagged"
relax = 0.6
nsp = 0
daily = true
ats = true
build_only = false
standalone = ""
probe = false
max_discrepancy = 1.0
allow_bad_budget = false

[grid]
boundary = "lm_lim.shp"
streams = "hydrography.shp"
ponds = "lm_ponds.shp"
crs_epsg = 23029
cell_size = 50.0
buffer = 25.0
kind = "voronoi"
resample = "auto"

[grid.override]
enable = false
xllcorner = 739300.0
yllcorner = 4553050.0
nrow = 65
ncol = 60

[grid.voronoi]
cell_far = 50.0
cell_near_stream = 5.0
stream_buffer = 65.0
stream_refine = true
grade_ratio = 3.0
trans_levels = [5.0, 20.0, 65.0]
seed_ponds = true

[grid.quadtree]
refine_level = 2
refine_streams = true

[surface]
meteo_ts = "__meteoTB.txt"
irrigation = true
irr_ts = "__IRR_TS.txt"
crop_schedule = "__inputFIELD%d_crop_schedule.txt"
nfield = 1
out_prefix = "lamata"
plot = 0

[surface.meteo_zones]
how = "auto"
value = 1.0
fill = 0.0

[surface.irr_zones]
layer = "Irr_Fields.shp"
column = "field_id"
how = "majority"
fill = 0.0

[[surface.station]]
name = "Sardon"
x = 739508.0
y = 4555882.0
z = 798.422
tz_lon = 0.0
fuse_shift = 1.0
data_shift = 3.0
z_wind = 6.0
z_hum = 6.0

[[surface.vegetation]]
name = "grassMU"
h_dry = 0.01
h_wet = 0.5
canopy_mm = 0.15
c_leaf = 0.01
lai_dry = 0.0
lai_wet = 2.88
shelter_dry = 0.5
shelter_wet = 0.55
albedo_dry = 0.5
albedo_wet = 0.2
j_dry = 150
j_wet = 300
trans_dry_wet = 20
trans_wet_dry = 30
root_depth = 0.4
ktg_min = 0.05
ktg_max = 0.1
kt_f = 0.5
kt_s = 1.0

[[surface.vegetation]]
name = "Qilex"
h_dry = 6.0
h_wet = 6.0
canopy_mm = 1.16
c_leaf = 0.004
lai_dry = 6.0
lai_wet = 6.0
shelter_dry = 0.75
shelter_wet = 0.7
albedo_dry = 0.25
albedo_wet = 0.1
j_dry = 150
j_wet = 290
trans_dry_wet = 20
trans_wet_dry = 50
root_depth = 15.0
ktg_min = 0.044694325
ktg_max = 0.865399396
kt_f = 0.10177166815831
kt_s = 0.04549277590845763

[[surface.vegetation]]
name = "Qpyr"
h_dry = 8.0
h_wet = 8.0
canopy_mm = 1.75
c_leaf = 0.004
lai_dry = 6.0
lai_wet = 1.0
shelter_dry = 0.8
shelter_wet = 0.3
albedo_dry = 0.25
albedo_wet = 0.15
j_dry = 150
j_wet = 290
trans_dry_wet = 20
trans_wet_dry = 30
root_depth = 10.0
ktg_min = 0.044694325
ktg_max = 0.865399396
kt_f = 0.10177166815831
kt_s = 0.04549277590845763

[[surface.crop]]
name = "alfalfa"
h = 0.7
canopy_mm = 0.15
c_leaf = 0.01
lai = 3.5
shelter = 0.55
albedo = 0.15
root_depth = 1.2
ktg_min = 0.05
ktg_max = 0.1
kt_f = 0.5
kt_s = 1.0

[[surface.soil]]
name = "alluvium"
porosity = 0.4
field_capacity = 0.25
albedo_dry = 0.2
albedo_wet = 0.15
j_dry = 150
j_wet = 270
trans_dry_wet = 20
trans_wet_dry = 20

[[surface.soil]]
name = "regolith"
porosity = 0.35
field_capacity = 0.15
albedo_dry = 0.25
albedo_wet = 0.2
j_dry = 150
j_wet = 270
trans_dry_wet = 20
trans_wet_dry = 20

[[surface.soil]]
name = "outcrop"
porosity = 0.05
field_capacity = 0.02
albedo_dry = 0.3
albedo_wet = 0.2
j_dry = 130
j_wet = 270
trans_dry_wet = 20
trans_wet_dry = 20

[soil]
params = "MF_ws/inputSOILparam.txt"
veg_layer = "lm_veg.shp"
veg_column = "Species"

[soil.zones]
layer = "Soil_type.shp"
column = "SoilCode"
how = "majority"
fill = 0.0

[soil.thickness]
column = "SOILthick"
how = "area_mean"
raster = "inputSOILthick.asc"
fill = 0.0

[[soil.veg_class]]
code = "g"
veg = 1

[[soil.veg_class]]
code = "i"
veg = 2

[[soil.veg_class]]
code = "p"
veg = 3

[obs]
table = "inputObs.txt"
layer = "202109MonitPts.shp"
name_column = "Name"
heads_prefix = "inputObsHEADS"
sm_prefix = "inputObsSM"
ro_prefix = "inputObsRo"

[layers]
nlay = 2
aggregate = false

[uzf]
vks_scale = 1.0

[seep]
kind = "drn"
cond = 10000.0

[et]
uzf_et = false
unsat_form = "etwc"
gwet_in_mf = false
extdp_source = "uniform"
extdp_default = 2.0
extwc_source = "thtr"

[sfr]
enable = false
source = "inputSTREAM.csv"
min_slope = 0.0001
monotonic_bed = true

[sfr.width]
drainage = {w_min = 1.5, w_max = 3.0, power = 2.0}

[sfr.depth]
value = 1.0

[sfr.manning]
value = 0.035

[sfr.rhk]
value = 0.1

[sfr.rbth]
value = 0.5

[lak]
enable = false
source = "inputPONDS.csv"
polygons = "lm_ponds.shp"
depth = 1.5
geometry = "inputPONDS.geojson"
bedleak = 0.001
surfdep = 0.05
maxiter = 200
stagechg = 0.0001

[crr]
enable = false
beta = 1.0
sinks = "evaporate"
dem = "inputDEMfill.asc"

[spinup]
cycles = 1
tol = 0.05
strt_heads = "hi_spinup"
steady_means = "hi_spinup"
save_strt = ""
save_means = ""
strt_dem = []

[postproc]
enable = true
preproc = true
only = false
sankey_min_flux = 0.05
sankey_full = true
sankey_obs_years = false
map_days = 6
hydro_year_start = 10
wb_unit = "year"
obs_series = true
sankey = true
input_maps = false
result_maps = true
tick_trimester_years = 10
tick_semester_years = 20

[pest]
use_pest_params = false
params_npz = "pest_optimised.npz"

[ui]
execution = "local"
runs_dir = ""
port = 8501
address = "localhost"
poll_secs = 3
