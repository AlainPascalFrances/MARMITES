# MARMITES resolved run configuration
# config_hash = 4b81f0bdcf15a17e

[meta]
config_version = 1
model = "lamata"
name = "2lay_drn_spinup"
description = "La Mata, 2 layers, DRN seepage, from the saved spin-up state"

[paths]
case = "LaMata"
ws = ""
gis_ws = ""
nwt_reference = ""
libmf6 = "auto"

[run]
surface = false
model = true
plot = true
mode = "lagged"
relax = 0.6
nsp = 365
daily = true
perlen_max = 10
ats = true
ats_dtmin = 0.0002
build_only = false
standalone = ""
probe = false
max_discrepancy = 1.0
allow_bad_budget = false

[grid]
boundary = "lm_lim.shp"
streams = "hydrography.shp"
ponds = "lm_ponds.shp"
dem = "lm_demfill"
crs_epsg = 23029
cell_size = 50.0
buffer = 25.0
kind = "voronoi"
resample = "auto"

[grid.override]
enable = false
xllcorner = 739300.0
yllcorner = 4553050.0
nrow = 65
ncol = 60

[grid.voronoi]
cell_far = 50.0
cell_near_stream = 20.0
stream_buffer = 60.0
stream_refine = true
grade_ratio = 2.0
trans_levels = [20.0, 60.0]
refine_ponds = true
cell_pond = 40.0

[grid.quadtree]
refine_level = 2
refine_streams = true
refine_ponds = false
pond_level = 0

[surface]
meteo_ts = "__meteoTB.txt"
irrigation = true
irr_ts = "__IRR_TS.txt"
crop_schedule = "__inputFIELD%d_crop_schedule.txt"
nfield = 1
out_prefix = "lamata"
plot = 0

[surface.meteo_zones]
how = "auto"
value = 1.0
fill = 0.0

[surface.irr_zones]
layer = "Irr_Fields.shp"
column = "field_id"
how = "majority"
fill = 0.0

[[surface.station]]
name = "Sardon"
x = 739508.0
y = 4555882.0
z = 798.422
tz_lon = 0.0
fuse_shift = 1.0
